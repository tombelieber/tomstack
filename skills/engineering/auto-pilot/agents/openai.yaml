interface:
  display_name: "Auto Pilot"
  short_description: "Build a verified PR or keep one task through production"
  default_prompt: "$auto-pilot pr <approved-plan-path>. Use ship instead when I explicitly want production delivery. In ship, the same accountable task must implement, qualify the PR, bind the exact candidate, merge, deploy or distribute, and prove production; do not create a continuation task or stop at pr_ready or merge. Ship and release end only as released or blocked. Do not impose an arbitrary wall-clock budget; wait in the current task. If no production path exists, block before merge. Direct release keeps the admitted candidate immutable and returns one bounded repair packet for a deterministic pre-mutation blocker."
policy:
  allow_implicit_invocation: false
