interface:
  display_name: "Auto Pilot"
  short_description: "Reach PR_READY or SHIPPED without leaving the task"
  default_prompt: "$auto-pilot pr <approved-plan-path>. Use ship for complete production delivery. There are only two achieved end states: PR_READY means every non-production and release-readiness item is complete and only the production action remains; SHIPPED means the exact candidate is proven live with zero scoped leftovers. Release, promote, and deploy are ship aliases. Keep this task accountable and resumable through waits, safe repairs, changed external state, and linked attempts; never seal it or require a new session."
policy:
  allow_implicit_invocation: false
